services:
  modelo-api:
    build: ./modelo-api
    container_name: modelo_energia_api
    ports:
      - "8000:8000"
    networks:
      - energiai_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  energiai-api:
    build: ./energiai-api
    container_name: energiai_api
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/energiai
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - MODELO_API_URL=http://modelo-api:8000
    networks:
      - energiai_net
    volumes:
      - ./energiai-api:/app
      - ~/.m2:/root/.m2
    depends_on:
      db:
        condition: service_started
      modelo-api:
        condition: service_healthy

  db:
    image: mysql:9.7
    container_name: mysql_energiai
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: energiai
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - energiai_net

volumes:
  mysql_data:

networks:
  energiai_net: