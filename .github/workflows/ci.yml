name: CI

on:
  push:
  pull_request:

jobs:
  modelo-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r modelo-api/requirements-dev.txt
      - run: pytest -q
        working-directory: modelo-api
      - run: docker build -t energiai-modelo:test modelo-api

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: ./mvnw test
        working-directory: energiai-api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: energiai-frontend/package-lock.json
      - run: npm ci
        working-directory: energiai-frontend
      - run: npm run build
        working-directory: energiai-frontend
