server {
    listen 80;
    server_name energiai-frontend;

    root /usr/share/nginx/html;
    index index.html;

    # Servir archivos estáticos con caché de un año para mejorar el rendimiento
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, inmutable";
    }

    # Proxy API requests to backend
    location /analisis-energetico {
        proxy_pass http://energiai-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preservar el esquema original (https) que Caddy ya propagó; $scheme aquí
        # siempre es http porque Caddy proxya a nginx por HTTP interno.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Proxy de verificación de correo al backend
    location /verificacion {
        proxy_pass http://energiai-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preservar el esquema original (https) que Caddy ya propagó; $scheme aquí
        # siempre es http porque Caddy proxya a nginx por HTTP interno.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # rediregir todas las rutas al index.html para que el enrutador del frontend maneje la navegación
    location / {
        try_files $uri $uri/ /index.html;
    }


    # Prevenir el acceso a archivos ocultos (como .htaccess, .git, etc.)
    location ~ /\. {
        deny all;
    }
}