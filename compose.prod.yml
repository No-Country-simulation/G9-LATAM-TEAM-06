services:
  caddy:
    image: caddy:2.8-alpine
    container_name: caddy_energiai
    restart: unless-stopped
    # Única entrada pública: HTTPS (443) y redirección (80).
    ports:
      - "80:80"
      - "443:443"
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - energiai_net
    depends_on:
      - energiai-frontend
    secrets:
      - api_key_secret
    healthcheck:
      # Caddy responde 308 (redirect a HTTPS) en http://localhost/, lo que rompe
      # el wget; se verifica el proceso en lugar del HTTP.
      test: ["CMD", "pgrep", "caddy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  energiai-frontend:
    build:
      context: ./energiai-frontend
      args:
        API_KEY_SECRET: ${API_KEY_SECRET_PROD}
    container_name: energiai_frontend
    restart: unless-stopped
    # Sin puerto publicado: solo accesible internamente a través de Caddy.
    networks:
      - energiai_net
    depends_on:
      - energiai-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  modelo-api:
    build: ./modelo-api
    container_name: modelo_energia_api
    restart: unless-stopped
    # Puerto NO publicado: solo accesible internamente por energiai-api (red energiai_net).
    networks:
      - energiai_net
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  energiai-api:
    build: ./energiai-api
    container_name: energiai_api
    restart: unless-stopped
    # Sin puerto publicado: solo accesible internamente a través de Caddy.
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://db:3306/energiai
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_PROFILES_ACTIVE=prod
      - MODELO_API_URL=http://modelo-api:8000
      - MODELO_API_FALLBACK_ENABLED=false
      - API_KEY_SECRET_FILE=/run/secrets/api_key_secret
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://energiai-06.navmx.com,http://localhost,http://localhost:8080}
    networks:
      - energiai_net
    depends_on:
      db:
        condition: service_healthy
      modelo-api:
        condition: service_healthy
    secrets:
      - api_key_secret
      - db_password
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  db:
    image: mysql:9.7
    container_name: mysql_energiai
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: energiai
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - energiai_net
    secrets:
      - db_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mysql_data:
  caddy_data:
  caddy_config:
networks:
  energiai_net:

secrets:
  api_key_secret:
    file: ./secrets/api_key_secret_prod.txt
  db_password:
    file: ./secrets/db_password_prod.txt