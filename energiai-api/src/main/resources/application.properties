# CONFIGURACION DEL SERVIDOR
server.port=8080
server.servlet.context-path=/

# CONFIGURACION DE LA BASE DE DATOS
spring.datasource.url=jdbc:mysql://db:3306/energiai
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACION DE HIBERNATE / JPA
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

# CONFIGURACION DE FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# API KEY SEGURIDAD
api.key.secret=${API_KEY_SECRET}
api.key.secret.file=${API_KEY_SECRET_FILE:}

# MODELO-API CONFIGURATION
modelo-api.url=http://modelo-api:8000
modelo-api.connect-timeout=5000
modelo-api.read-timeout=10000
modelo-api.write-timeout=10000
modelo-api.fallback-enabled=true

# CORS CONFIGURATION
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:8080}

# SWAGGER / OPENAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha