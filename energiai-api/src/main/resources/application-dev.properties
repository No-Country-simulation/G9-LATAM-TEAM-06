# Configuracion del Sv
server.port=8080
server.servlet.context-path=/

# Rechazar propiedades JSON no contempladas por el contrato de entrada.
spring.jackson.deserialization.fail-on-unknown-properties=true

#Config de la BD
spring.datasource.url=jdbc:mysql://db:3306/energiai
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Config del Hibernate/JPA
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

#Config del Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# MODELO-API CONFIGURATION
modelo-api.url=http://modelo-api:8000
modelo-api.connect-timeout=5000
modelo-api.read-timeout=10000
modelo-api.write-timeout=10000
modelo-api.fallback-enabled=true

# SECRETS CONFIGURATION (Docker Secrets)
api.key.secret.file=${API_KEY_SECRET_FILE:/run/secrets/api_key_secret}

# CORS CONFIGURATION
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:8080,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:8080}

# Login - Desarrollo
logging.level.root=INFO
logging.level.com.hackathon=DEBUG
logging.level.org.hibernate.SQL=DEBUG
