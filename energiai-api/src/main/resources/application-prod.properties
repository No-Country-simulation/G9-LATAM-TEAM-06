# CONFIGURACIÓN DEL SERVIDOR
server.port=8080
server.servlet.context-path=/

# CONFIGURACIÓN DE LA BASE DE DATOS
spring.datasource.url=jdbc:mysql://db:3306/energiai
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN DE HIBERNATE / JPA
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CONFIGURACIÓN DE FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# MODELO-API CONFIGURATION
modelo-api.url=http://modelo-api:8000
modelo-api.connect-timeout=5000
modelo-api.read-timeout=10000
modelo-api.write-timeout=10000
modelo-api.fallback-enabled=true

# SECRETS CONFIGURATION (Docker Secrets)
api.key.secret.file=${API_KEY_SECRET_FILE:/run/secrets/api_key_secret}

# CORS CONFIGURATION
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://tudominio.com,https://www.tudominio.com}

# LOGGING - PRODUCCIÓN (sin detalles sensibles)
logging.level.root=WARN
logging.level.com.hackathon=INFO
logging.level.org.hibernate.SQL=WARN

# DEVTOOLS DESHABILITADO EN PROD
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false