# CONFIGURACIÓN DEL SERVIDOR
server.port=8080
server.servlet.context-path=/

# Rechazar propiedades JSON no contempladas por el contrato de entrada.
spring.jackson.deserialization.fail-on-unknown-properties=true

# CONFIGURACIÓN DE LA BASE DE DATOS
spring.datasource.url=jdbc:mysql://db:3306/energiai
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CONFIGURACIÓN DE HIBERNATE / JPA
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CONFIGURACIÓN DE FLYWAY
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# MODELO-API CONFIGURATION
modelo-api.url=http://modelo-api:8000
modelo-api.connect-timeout=5000
modelo-api.read-timeout=10000
modelo-api.write-timeout=10000
# En producción el fallback de reglas está deshabilitado: si el modelo no responde, la API responde 503.
modelo-api.fallback-enabled=false

# SECRETS CONFIGURATION (Docker Secrets)
api.key.secret.file=${API_KEY_SECRET_FILE:/run/secrets/api_key_secret}

# CORS CONFIGURATION
# Con Caddy todo el tráfico es mismo origen, así que normalmente no aplica.
# Se mantiene configurable por si se accede directo a la API. Ver .env.ejemplo.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://energiai-06.navmx.com,http://localhost,http://localhost:8080}

# SMTP / CORREO
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.from=${MAIL_FROM:no-responder@energiai.app}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# VERIFICACIÓN DE CORREO
verificacion.codigo.ttl-minutos=${VERIFICACION_TTL_MINUTOS:10}
verificacion.codigo.max-intentos=${VERIFICACION_MAX_INTENTOS:3}
verificacion.rate-limit.por-hora=${VERIFICACION_RATE_LIMIT_POR_HORA:5}

# LOGGING - PRODUCCIÓN (sin detalles sensibles)
logging.level.root=WARN
logging.level.com.hackathon=INFO
logging.level.org.hibernate.SQL=WARN

# DEVTOOLS DESHABILITADO EN PROD
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
